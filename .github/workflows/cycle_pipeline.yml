name: Hourly Forecast & Drift Pipeline

on:
  schedule:
    # Se ejecuta cada hora al minuto 40 (ej: 1:40, 2:40, 3:40, etc.)
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      submit:
        description: 'Enviar predicción a la API oficial (desmarcar para dry-run)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  forecast-and-drift:
    name: Forecast, Drift Monitor & Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./pulso-transmi-sdk

      - name: Restore Prediction State Cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/prediction_state.json
          key: prediction-state-${{ github.run_id }}
          restore-keys: |
            prediction-state-

      - name: Run Cycle Pipeline
        id: run_pipeline
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRIFT_WEBHOOK_URL: ${{ secrets.DRIFT_WEBHOOK_URL }}
        run: |
          # Si se dispara manualmente sin check de submit, corre dry-run; de lo contrario, envía con --submit
          SUBMIT_FLAG="--submit"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.submit }}" = "false" ]; then
            SUBMIT_FLAG="--dry-run"
          fi
          
          python -m src.predict_cycle $SUBMIT_FLAG

      - name: Create GitHub Issue on Drift Detection
        if: steps.run_pipeline.outputs.retrain_recommended == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const maxPsi = '${{ steps.run_pipeline.outputs.max_psi }}';
            const owner = context.repo.owner;
            const issueTitle = `🚨 Alerta de Drift: Reentrenamiento recomendado (PSI: ${maxPsi})`;
            const issueBody = `@${owner} Se ha detectado **Drift** significativo en el flujo de datos de Pulso TransMilenio.\n\n` +
              `### 📊 Métricas del Drift:\n` +
              `- **Max PSI alcanzado:** \`${maxPsi}\` (Umbral de alerta: \`0.20\`)\n` +
              `- **Ejecución de Workflow:** [Ver log completo en GitHub Actions](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `> 💡 **Acción requerida:** Reentrenar el modelo incorporando los datos acumulados en el stream para recuperar accuracy.`;
            
            // Buscar si ya existe un issue abierto con la etiqueta drift-alert para evitar spam
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'drift-alert',
              state: 'open'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                assignees: [owner],
                labels: ['drift-alert']
              });
              console.log(`Issue de alerta de drift creado y asignado a @${owner}.`);
            } else {
              console.log('Ya existe un issue de drift abierto; no se duplicará.');
            }

      - name: Save Prediction State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: artifacts/prediction_state.json
          key: prediction-state-${{ github.run_id }}

      - name: Upload State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-state
          path: artifacts/prediction_state.json
          retention-days: 14
